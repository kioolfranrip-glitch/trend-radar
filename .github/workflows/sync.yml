name: Sync trends and deploy

# 定时抓取 → 生成静态快照 → 部署到 Cloudflare Pages
# 站点本身是纯静态的，这里只是"每隔一段时间重新生成一次数据"

on:
  schedule:
    # 每 3 小时一次（Google 每日热搜本身一天也只更新数次，没必要更频繁）
    - cron: '0 */3 * * *'
  workflow_dispatch: {} # 支持手动触发
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**.md'

concurrency:
  group: sync-trends
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 复用上一轮的抓取缓存：某个源临时失败时可以沿用旧数据，不会把站点刷空
      - name: Restore crawl cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: trends-cache-${{ github.run_id }}
          restore-keys: |
            trends-cache-

      - name: Crawl trends
        env:
          # 可选：在仓库 Secrets 里配 HTTPS_PROXY，让抓取走你的代理
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: node tools/crawl.mjs --jobs=4

      - name: Verify snapshot
        run: |
          test -f public/data/board.json || { echo "board.json missing"; exit 1; }
          node -e "
            const m = require('./public/data/meta.json');
            console.log('coverage:', m.withData + '/' + m.requested);
            if (m.withData < 20) { console.error('too few countries, aborting deploy'); process.exit(1); }
          "

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name=${{ vars.CF_PAGES_PROJECT || 'trends-world' }}
            --branch=main
